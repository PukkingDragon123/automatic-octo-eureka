<!doctype html><meta charset=utf-8><body style="margin:0;background:#7ba85a">
<canvas id=c width=960 height=300 style="width:1440px;height:450px;image-rendering:pixelated"></canvas>
<script type="module">
import { drawDog } from '../src/dog.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

let t = 0;
function frame(){
  t += 0.016;
  ctx.fillStyle='#8fb86a'; ctx.fillRect(0,0,480,150);
  const faces=['idle','happy','wow','sleep','closed'];
  for (let a=0;a<5;a++) drawDog(ctx, 50+a*95, 64, {age:a, face:faces[a], blush:a<2, pose: a===3?'sleep':'idle'});
  drawDog(ctx, 60, 135, {age:1, squash:0.45}); drawDog(ctx, 150, 135, {age:1, squash:-0.35, z:6});
  drawDog(ctx, 240, 135, {age:1, roll:1.2}); drawDog(ctx, 330, 135, {age:1, roll:3.1}); drawDog(ctx, 420, 135, {age:2, lean:0.6, face:'happy'});
  requestAnimationFrame(frame);
}
frame();
</script>
