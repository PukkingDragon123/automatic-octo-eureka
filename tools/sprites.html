<!doctype html><html><head><meta charset="utf-8"><title>sprites</title>
<style>body{background:#6f9c4e;margin:0}canvas{image-rendering:pixelated;display:block;margin:0 auto}</style>
</head><body><canvas id="c" width="480" height="300"></canvas>
<script type="module">
import { drawHuman } from '../src/human.js';
import { drawDog, AGES } from '../src/dog.js';
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = false;
c.style.width = (480*3)+'px'; c.style.height = (300*3)+'px';
let t = 0;
function draw() {
  t += 1/60;
  ctx.fillStyle = '#7fa86a'; ctx.fillRect(0,0,480,300);
  ctx.fillStyle = '#6f9c4e'; ctx.fillRect(0,100,480,3);
  ctx.fillStyle = '#6f9c4e'; ctx.fillRect(0,196,480,3);
  const row1 = 100, row2 = 196, row3 = 285;
  const A = (x,p,o={}) => drawHuman(ctx, x, row1, {char:'A', outfit:'uniformA', pose:p, t, phase:t*6, ...o});
  const B = (x,p,o={}) => drawHuman(ctx, x, row1, {char:'B', outfit:'uniformB', pose:p, t, phase:t*6, ...o});
  A(26,'stand',{face:'calm'});
  A(62,'walk',{face:'smile'});
  A(100,'sit_ground',{face:'closed', prop:'book'});
  A(142,'crouch',{face:'smile'});
  A(180,'wave',{face:'laugh'});
  B(220,'stand',{face:'calm', prop:'bag'});
  B(258,'walk',{face:'smile'});
  B(300,'sit_log',{face:'calm'});
  B(340,'reach',{face:'smile'});
  B(378,'arms_crossed',{face:'sad', flip:true});
  A(414,'hold',{face:'smile2'});
  B(436,'hold',{face:'smile', flip:true});
  const outfits = ['blazerA','cardigan','summerA','coatA','adultA'];
  outfits.forEach((o,i)=> drawHuman(ctx, 28+i*40, row2, {char:'A', outfit:o, pose:'stand', t, face:'smile', age:Math.min(2,i>>1)}));
  const outfitsB = ['blazerB','hoodie','summerB','coatB','adultB'];
  outfitsB.forEach((o,i)=> drawHuman(ctx, 232+i*40, row2, {char:'B', outfit:o, pose:'pockets', t, face:'calm', age:Math.min(2,i>>1)}));
  drawHuman(ctx, 436, row2, {char:'C', outfit:'child', pose:'stand', t, face:'laugh'});
  drawHuman(ctx, 462, row2, {char:'A', outfit:'adultA', pose:'stand', t, face:'smile', age:2, hairOverride:'bun'});
  // the dog through his life, and the bounce
  AGES.forEach((a,i)=> drawDog(ctx, 30+i*44, row3, {age:i, pose:'idle', t}));
  const hop = (p) => Math.max(0, Math.sin(t*4+p))*14;
  [0,1,2].forEach((i)=> drawDog(ctx, 250+i*40, row3, {age:2, t, z:hop(i*1.1), squash:-Math.cos(t*4+i*1.1)*0.12}));
  drawDog(ctx, 380, row3, {age:2, pose:'sit', t, face:'happy'});
  drawDog(ctx, 415, row3, {age:2, pose:'lie', t});
  drawDog(ctx, 452, row3, {age:4, pose:'sleep', t});
  requestAnimationFrame(draw);
}
draw();
</script></body></html>
