<!doctype html><html><head><meta charset="utf-8"><title>sprites</title>
<style>body{background:#6f9c4e;margin:0}canvas{image-rendering:pixelated;display:block;margin:0 auto}</style>
</head><body><canvas id="c" width="480" height="300"></canvas>
<script type="module">
import { drawHuman } from '../src/human.js';
import { drawDog, AGES } from '../src/dog.js';
const c = document.getElementById('c');
const ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = false;
c.style.width = (480*3)+'px'; c.style.height = (300*3)+'px';
let t = 0;
function draw() {
  t += 1/60;
  ctx.fillStyle = '#7fa86a'; ctx.fillRect(0,0,480,300);
  ctx.fillStyle = '#6f9c4e'; ctx.fillRect(0,96,480,4);
  ctx.fillStyle = '#6f9c4e'; ctx.fillRect(0,196,480,4);
  const row1 = 96, row2 = 196, row3 = 290;
  const A = (x,p,o={}) => drawHuman(ctx, x, row1, {char:'A', outfit:'uniformA', pose:p, t, phase:t*6, ...o});
  const B = (x,p,o={}) => drawHuman(ctx, x, row1, {char:'B', outfit:'uniformB', pose:p, t, phase:t*6, ...o});
  A(24,'stand',{face:'calm'});
  A(56,'walk',{face:'smile'});
  A(92,'sit_ground',{face:'closed', prop:'book'});
  A(132,'crouch',{face:'smile'});
  A(168,'wave',{face:'laugh'});
  B(208,'stand',{face:'calm', prop:'bag'});
  B(244,'walk',{face:'smile'});
  B(284,'sit_log',{face:'calm'});
  B(324,'reach',{face:'smile'});
  B(360,'arms_crossed',{face:'sad', flip:true});
  A(400,'hold',{face:'smile2'});
  B(420,'hold',{face:'smile', flip:true});
  A(455,'umbrella',{face:'calm', prop:'umbrella'});
  // outfits + ages
  const outfits = ['blazerA','cardigan','summerA','coatA','adultA'];
  outfits.forEach((o,i)=> drawHuman(ctx, 26+i*38, row2, {char:'A', outfit:o, pose:'stand', t, face:'smile', age:Math.min(2,i>>1)}));
  const outfitsB = ['blazerB','hoodie','summerB','coatB','adultB'];
  outfitsB.forEach((o,i)=> drawHuman(ctx, 216+i*38, row2, {char:'B', outfit:o, pose:'pockets', t, face:'calm', age:Math.min(2,i>>1)}));
  drawHuman(ctx, 420, row2, {char:'C', outfit:'child', pose:'stand', t, face:'laugh'});
  drawHuman(ctx, 450, row2, {char:'A', outfit:'adultA', pose:'stand', t, face:'smile', age:2, hairOverride:'bun'});
  // dogs through life
  AGES.forEach((a,i)=> drawDog(ctx, 30+i*44, row3, {age:i, pose:'stand', t}));
  const poses=['walk','run','sit','lie','sleep','eat','dig','bow','lookup'];
  poses.forEach((p,i)=> drawDog(ctx, 240+i*26, row3, {age:2, pose:p, t}));
  requestAnimationFrame(draw);
}
draw();
</script></body></html>
